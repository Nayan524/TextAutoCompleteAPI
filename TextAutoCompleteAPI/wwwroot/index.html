<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Text Autocomplete</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f7f7f7;
        }

        .container {
            max-width: 600px;
            margin-top: 60px;
        }

        .suggestions {
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container shadow p-4 bg-white rounded">
        <h2 class="mb-4 text-center">Autocomplete Suggestion Engine</h2>

        <form id="autoForm">
            <div class="mb-3">
                <label for="inputText" class="form-label">Enter text:</label>
                <input type="text" class="form-control" id="inputText" required>
                <div class="form-text">Type something to get autocomplete suggestions.</div>
            </div>
            <button type="submit" class="btn btn-primary w-100">Get Suggestions</button>
        </form>

        <div id="results" class="suggestions mt-4">
        </div>
    </div>

    <script>
        document.getElementById('autoForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const input = document.getElementById('inputText').value.trim();
            const results = document.getElementById('results');
            results.innerHTML = "";

            if (!input) {
                results.innerHTML = "<div class='alert alert-warning'>Please enter some text.</div>";
                return;
            }

            try {
                const response = await fetch("http://localhost:5093/api/auto", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ input: input })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }

                const data = await response.json();

                if (data.suggestions && data.suggestions.length > 0) {
                    const list = data.suggestions.map(s => `<li class="list-group-item">${s}</li>`).join('');
                    results.innerHTML = `<ul class="list-group">${list}</ul>`;
                } else {
                    results.innerHTML = "<div class='alert alert-info'>No suggestions found.</div>";
                }
            } catch (err) {
                console.error(err);
                results.innerHTML = `<div class='alert alert-danger'>Error: ${err.message}</div>`;
            }
        });
    </script>

</body>
</html>
